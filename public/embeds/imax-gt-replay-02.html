<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中国电影博物馆 · IMAX GT 开票座位实况回放</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..600&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet" referrerpolicy="no-referrer" />
  <link href="https://vercel.com/geist/vercel-brand.css" rel="stylesheet" />
  <style>
    html {
      -webkit-font-smoothing: antialiased;
    }
    body {
      text-wrap: pretty;
    }
    .vbg-title {
      text-wrap: balance;
    }
    /* ---------- 回放控制条 ---------- */
    .vbg-custom-player {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--vbg-surface-primary);
      padding: var(--vbg-space-3) 0;
      border-bottom: 1px solid var(--vbg-border-subtle);
    }
    .vbg-custom-player-row {
      display: flex;
      align-items: center;
      gap: var(--vbg-space-4);
      min-width: 0;
    }
    .vbg-custom-player-row > :first-child {
      flex: 0 0 auto;
    }
    .vbg-custom-play {
      flex: 0 0 auto;
      min-width: 72px;
      white-space: nowrap;
      border: 1px solid var(--vbg-border-strong);
      border-radius: var(--vbg-radius-small);
      padding: var(--vbg-space-2) var(--vbg-space-4);
      background: var(--vbg-surface-contrast);
      color: var(--vbg-text-on-contrast);
      cursor: pointer;
      font: inherit;
      font-size: var(--vbg-type-compact);
      text-align: center;
      transition: transform 120ms ease;
    }
    .vbg-custom-play:active {
      transform: scale(.96);
    }
    .vbg-custom-play:focus-visible {
      outline: 2px solid var(--vbg-focus);
      outline-offset: 2px;
    }
    .vbg-custom-track {
      flex: 1 1 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .vbg-custom-tlchart {
      display: block;
      width: 100%;
      height: 44px;
      cursor: crosshair;
      touch-action: none;
    }
    .vbg-custom-tlchart .vbg-viz-tl-area {
      fill: var(--vbg-chart-1);
      fill-opacity: .14;
    }
    .vbg-custom-tlchart .vbg-viz-tl-line {
      fill: none;
      stroke: var(--vbg-chart-1);
      stroke-width: 1.5;
    }
    .vbg-custom-tlchart .vbg-viz-tl-head {
      stroke: var(--vbg-text-primary);
      stroke-width: 1;
    }
    .vbg-custom-player-row + .vbg-custom-player-row {
      margin-top: var(--vbg-space-2);
    }
    .vbg-custom-scrub {
      flex: 1 1 auto;
      min-width: 0;
      accent-color: var(--vbg-text-primary);
    }
    .vbg-custom-clock {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
    }
    .vbg-custom-player-sub {
      justify-content: space-between;
    }
    .vbg-custom-speed {
      display: inline-flex;
      gap: var(--vbg-space-1);
    }
    .vbg-custom-speed button {
      border: 1px solid var(--vbg-border-default);
      border-radius: var(--vbg-radius-small);
      padding: var(--vbg-space-1) var(--vbg-space-2);
      background: transparent;
      color: var(--vbg-text-primary);
      cursor: pointer;
      font: inherit;
      font-family: "Geist Mono", monospace;
      font-size: var(--vbg-type-metadata);
    }
    .vbg-custom-speed button:hover {
      border-color: var(--vbg-border-strong);
    }
    .vbg-custom-speed button[aria-pressed="true"] {
      background: var(--vbg-surface-contrast);
      border-color: var(--vbg-surface-contrast);
      color: var(--vbg-text-on-contrast);
    }
    .vbg-custom-speed button:focus-visible {
      outline: 2px solid var(--vbg-focus);
      outline-offset: 2px;
    }
    /* ---------- 总览卡片 ---------- */
    .vbg-custom-overview-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--vbg-space-5);
    }
    .vbg-custom-card {
      display: flex;
      flex-direction: column;
      gap: var(--vbg-space-3);
      min-width: 0;
      margin: 0;
      padding: var(--vbg-space-4);
      border: 1px solid var(--vbg-border-subtle);
      border-radius: var(--vbg-radius);
      background: transparent;
      cursor: pointer;
      text-align: left;
      font: inherit;
      color: inherit;
      transition: border-color 120ms ease;
    }
    .vbg-custom-card:hover {
      border-color: var(--vbg-border-strong);
    }
    .vbg-custom-card[aria-pressed="true"] {
      border-color: var(--vbg-focus);
    }
    .vbg-custom-card:focus-visible {
      outline: 2px solid var(--vbg-focus);
      outline-offset: 3px;
    }
    .vbg-custom-card-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--vbg-space-3);
    }
    .vbg-custom-card-head h3 {
      margin: 0;
    }
    .vbg-custom-card-pct {
      color: var(--vbg-text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .vbg-custom-card-meta {
      display: flex;
      justify-content: space-between;
      gap: var(--vbg-space-3);
      color: var(--vbg-text-secondary);
      font-size: var(--vbg-type-compact);
      font-variant-numeric: tabular-nums;
    }
    .vbg-custom-card-meta strong {
      color: var(--vbg-text-primary);
      font-weight: var(--vbg-weight-medium);
    }
    /* ---------- 迷你座位图 ---------- */
    .vbg-custom-minimap {
      display: grid;
      row-gap: 2px;
    }
    .vbg-custom-minirow {
      display: grid;
      grid-template-columns: repeat(38, minmax(0, 1fr));
      column-gap: 1px;
    }
    .vbg-custom-minicell {
      display: block;
      aspect-ratio: 1;
      border: 1px solid var(--vbg-border-strong);
      border-radius: 1px;
      background: transparent;
    }
    .vbg-custom-minicell.empty {
      visibility: hidden;
    }
    .vbg-custom-minicell.sold {
      background: var(--vbg-surface-contrast);
      border-color: var(--vbg-surface-contrast);
    }
    .vbg-custom-minicell.newsale {
      background: var(--vbg-color-info);
      border-color: var(--vbg-color-info);
    }
    .vbg-custom-minicell.released {
      background: var(--vbg-color-warning);
      border-color: var(--vbg-color-warning);
    }
    .vbg-custom-minicell.pending,
    .vbg-custom-seat.pending {
      opacity: .18;
    }
    /* ---------- 单场细节座位图 ---------- */
    .vbg-custom-seatmap {
      margin: 0;
    }
    .vbg-custom-stage {
      position: relative;
      height: 72px;
      width: min(620px, 72%);
      margin: 0 auto var(--vbg-space-8);
      padding: var(--vbg-space-4) 0 var(--vbg-space-2);
      border: 1px solid var(--vbg-border-default);
      border-top: 3px solid var(--vbg-border-strong);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      color: var(--vbg-text-secondary);
      text-align: center;
      font-size: var(--vbg-type-label);
    }
    .vbg-custom-stage::before,
    .vbg-custom-stage::after {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      border-top: 1px solid var(--vbg-border-subtle);
    }
    .vbg-custom-stage span { position: relative; z-index: 1; }
    .vbg-custom-stage::before { top: 21px; }
    .vbg-custom-stage::after { top: 29px; }
    .vbg-custom-legend {
      display: flex;
      gap: var(--vbg-space-6);
      justify-content: center;
      flex-wrap: wrap;
      color: var(--vbg-text-secondary);
      font-size: var(--vbg-type-compact);
    }
    .vbg-custom-legend-item {
      display: inline-flex;
      align-items: center;
      gap: var(--vbg-space-2);
    }
    .vbg-custom-legend-mark {
      width: 13px;
      height: 13px;
      border: 1px solid var(--vbg-border-strong);
      background: transparent;
    }
    .vbg-custom-legend-mark[data-state="sold"] {
      background: var(--vbg-surface-contrast);
      border-color: var(--vbg-surface-contrast);
    }
    .vbg-custom-legend-mark[data-state="newsale"] {
      background: var(--vbg-color-info);
      border-color: var(--vbg-color-info);
    }
    .vbg-custom-legend-mark[data-state="released"] {
      background: var(--vbg-color-warning);
      border-color: var(--vbg-color-warning);
    }
    .vbg-custom-map-viewport {
      overflow-x: auto;
      overflow-y: visible;
      padding: var(--vbg-space-6) 0 var(--vbg-space-3);
    }
    .vbg-custom-map {
      --vbg-custom-seat-size: 26px;
      --vbg-custom-seat-gap: var(--vbg-space-1);
      --vbg-custom-row-gap: var(--vbg-space-3);
      min-width: 930px;
      max-width: 950px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 32px minmax(0, 1fr);
      gap: var(--vbg-space-3);
      align-items: start;
    }
    .vbg-custom-row-labels,
    .vbg-custom-seat-grid {
      display: grid;
      grid-template-rows: repeat(11, var(--vbg-custom-seat-size));
      row-gap: var(--vbg-custom-row-gap);
      padding-top: 1px;
    }
    .vbg-custom-row-labels span {
      color: var(--vbg-text-secondary);
      font-family: "Geist Mono", monospace;
      font-size: var(--vbg-type-metadata);
      line-height: var(--vbg-custom-seat-size);
      text-align: center;
    }
    .vbg-custom-seat-row {
      display: grid;
      grid-template-columns: repeat(38, minmax(0, 1fr));
      column-gap: var(--vbg-custom-seat-gap);
      min-width: 0;
    }
    .vbg-custom-seat {
      position: relative;
      width: 100%;
      aspect-ratio: 1.3 / 1;
      border: 1px solid var(--vbg-border-strong);
      border-radius: 3px 3px 2px 2px;
      background: transparent;
      transition: background-color 120ms ease, border-color 120ms ease;
    }
    .vbg-custom-seat::before {
      content: "";
      position: absolute;
      left: 3px;
      right: 3px;
      top: 4px;
      height: 45%;
      border: 1px solid var(--vbg-border-strong);
      border-radius: 1px;
      opacity: .72;
    }
    .vbg-custom-seat::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 2px;
      bottom: -4px;
      height: 4px;
      border: 1px solid var(--vbg-border-strong);
      border-top: 0;
      border-radius: 0 0 2px 2px;
      background: transparent;
    }
    .vbg-custom-seat.empty {
      visibility: hidden;
    }
    .vbg-custom-seat.sold {
      background: var(--vbg-surface-contrast);
    }
    .vbg-custom-seat.sold::before {
      border-color: var(--vbg-border-on-contrast);
    }
    .vbg-custom-seat.sold::after {
      background: var(--vbg-surface-contrast);
    }
    .vbg-custom-seat.newsale,
    .vbg-custom-seat.newsale::after {
      background: var(--vbg-color-info);
      border-color: var(--vbg-color-info);
    }
    .vbg-custom-seat.newsale::before {
      border-color: var(--vbg-border-on-contrast);
    }
    .vbg-custom-seat.released,
    .vbg-custom-seat.released::after {
      background: var(--vbg-color-warning);
      border-color: var(--vbg-color-warning);
    }
    .vbg-custom-seat.released::before {
      border-color: var(--vbg-border-on-contrast);
    }
    /* ---------- 细节统计与变化 ---------- */
    .vbg-custom-detail-stats {
      display: flex;
      gap: var(--vbg-space-8);
      flex-wrap: wrap;
      color: var(--vbg-text-secondary);
      font-size: var(--vbg-type-compact);
      font-variant-numeric: tabular-nums;
    }
    .vbg-custom-detail-stats strong {
      color: var(--vbg-text-primary);
      font-weight: var(--vbg-weight-medium);
    }
    .vbg-custom-changes {
      min-height: 1.5em;
      color: var(--vbg-text-secondary);
      font-size: var(--vbg-type-compact);
    }
    .vbg-custom-changes strong {
      font-weight: var(--vbg-weight-medium);
    }
    .vbg-custom-changes .is-newsale {
      color: var(--vbg-color-info);
    }
    .vbg-custom-changes .is-released {
      color: var(--vbg-color-warning);
    }
    .vbg-custom-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: var(--vbg-space-4);
      flex-wrap: wrap;
    }
    .vbg-custom-section-head h2 {
      margin: 0;
    }
    @media (max-width: 900px) {
      .vbg-custom-overview-grid {
        grid-template-columns: minmax(0, 1fr);
      }
    }
    @media (max-width: 700px) {
      .vbg-custom-map { --vbg-custom-seat-size: 20px; }
      .vbg-custom-legend { justify-content: flex-start; }
    }
    @media (prefers-reduced-motion: reduce) {
      .vbg-custom-seat,
      .vbg-custom-card { transition: none; }
    }
  </style>
</head>
<body class="vbg-report dark-theme" data-theme="dark">
  <div class="vbg-shell">
    <a class="vbg-skip-link" href="#main">跳转到内容</a>
    <header class="vbg-header">
      <div class="vbg-masthead">
        <div class="vbg-document-meta">
          <span>中国电影博物馆</span>
          <span>IMAX GT 巨幕激光厅</span>
          <span id="metaWindow">采集窗口</span>
          <span>北京时间</span>
        </div>
      </div>
    </header>
    <main id="main">
      <section class="vbg-opening">
        <div class="vbg-opening-claim">
          <p class="vbg-label">售票实况回放</p>
          <h1 class="vbg-title">《奥德赛》开票实况回放</h1>
          <p class="vbg-lede" id="lede"></p>
        </div>
        <div class="vbg-opening-proof">
          <div class="vbg-stat-strip">
            <div class="vbg-stat">
              <p class="vbg-stat-label">覆盖场次</p>
              <p class="vbg-stat-value" id="statShows">–</p>
              <p class="vbg-stat-detail" id="statShowsDetail">实际开放场次</p>
            </div>
            <div class="vbg-stat">
              <p class="vbg-stat-label">座位快照</p>
              <p class="vbg-stat-value" id="statFrames">–</p>
              <p class="vbg-stat-detail">全场 340 座逐座状态</p>
            </div>
            <div class="vbg-stat">
              <p class="vbg-stat-label">状态变更</p>
              <p class="vbg-stat-value" id="statFlips">–</p>
              <p class="vbg-stat-detail">新售与释放合计</p>
            </div>
            <div class="vbg-stat">
              <p class="vbg-stat-label">末帧可选</p>
              <p class="vbg-stat-value" id="statAvail">–</p>
              <p class="vbg-stat-detail">全部场次合计</p>
            </div>
          </div>
        </div>
      </section>

      <div class="vbg-custom-player" aria-label="回放控制">
        <div class="vbg-custom-player-row">
          <button class="vbg-custom-play" id="play" type="button">播放</button>
          <div class="vbg-custom-track">
            <svg class="vbg-custom-tlchart" id="tlchart" viewBox="0 0 1000 44" preserveAspectRatio="none" role="img" aria-label="全部场次合计可选座位随时间的曲线，点击或拖动可定位">
              <path class="vbg-viz-tl-area" id="tlArea" d="" />
              <path class="vbg-viz-tl-line" id="tlLine" d="" />
              <line class="vbg-viz-tl-head" id="tlHead" x1="0" y1="0" x2="0" y2="44" />
            </svg>
            <input class="vbg-custom-scrub" id="scrub" type="range" min="0" max="100" step="0.1" value="0" aria-label="回放进度" />
          </div>
          <span class="vbg-custom-clock vbg-mono" id="clock">--:--:--</span>
        </div>
        <div class="vbg-custom-player-row vbg-custom-player-sub">
          <span class="vbg-caption"><span id="offset">–</span> · 曲线：全部场次合计可选座位</span>
          <span class="vbg-custom-speed" role="group" aria-label="播放速度">
            <button type="button" data-speed="1" aria-pressed="false">1×</button>
            <button type="button" data-speed="10" aria-pressed="false">10×</button>
            <button type="button" data-speed="30" aria-pressed="true">30×</button>
            <button type="button" data-speed="60" aria-pressed="false">60×</button>
          </span>
        </div>
      </div>

      <section class="vbg-section vbg-flow" aria-labelledby="overviewTitle">
        <div class="vbg-custom-section-head">
          <h2 class="vbg-heading-24" id="overviewTitle">全部场次总览</h2>
          <div class="vbg-custom-legend" aria-label="座位状态图例">
            <span class="vbg-custom-legend-item"><i class="vbg-custom-legend-mark"></i>可选</span>
            <span class="vbg-custom-legend-item"><i class="vbg-custom-legend-mark" data-state="sold"></i>已售</span>
            <span class="vbg-custom-legend-item"><i class="vbg-custom-legend-mark" data-state="newsale"></i>本帧新售</span>
            <span class="vbg-custom-legend-item"><i class="vbg-custom-legend-mark" data-state="released"></i>本帧释放</span>
          </div>
        </div>
        <div class="vbg-custom-overview-grid" id="overview"></div>
        <p class="vbg-caption">点击任意卡片，在下方查看该场次的逐座细节。新售与释放是相对上一帧的变化。</p>
      </section>

      <section class="vbg-section vbg-flow" aria-labelledby="detailTitle">
        <div class="vbg-custom-section-head">
          <h2 class="vbg-heading-24" id="detailTitle">单场细节</h2>
          <span class="vbg-mono vbg-caption" id="detailSub">–</span>
        </div>
        <figure class="vbg-custom-seatmap" aria-labelledby="detailTitle">
          <div class="vbg-custom-stage"><span>银幕中央</span></div>
          <div class="vbg-custom-map-viewport">
            <div class="vbg-custom-map" role="img" aria-label="当前场次座位状态图">
              <div class="vbg-custom-row-labels" aria-hidden="true" id="rowLabels"></div>
              <div class="vbg-custom-seat-grid" id="detailGrid"></div>
            </div>
          </div>
        </figure>
        <div class="vbg-custom-detail-stats" id="detailStats"></div>
        <p class="vbg-custom-changes" id="changes" aria-live="polite"></p>
      </section>
    </main>
    <footer class="vbg-footer">
      <span>数据来源：猫眼演出接口只读采集 · 仅供研究，不构成购票建议</span>
    </footer>

    const DATA = REPLAY_DATA;
    const SEAT_COUNT = DATA.seats.length;
    const INDEX_OF = new Map(DATA.seats.map(([r, c], i) => [r + ',' + c, i]));
    const SEAT_LABEL = DATA.seats.map(([r, c]) => r + '排' + c + '号');
    const DURATION = DATA.duration;

    // ---------- 预处理：每场每帧的已售数与相对上一帧的变化 ----------
    let totalFlips = 0;
    DATA.shows.forEach((show) => {
      show.ptr = -2;
      show.rendered = null;
      show.hl = [];
      show.frames = show.frames.map(([t, st]) => ({ t, st }));
      show.frames.forEach((f, i) => {
        let avail = 0;
        for (const ch of f.st) if (ch === '1') avail++;
        f.avail = avail;
        f.ns = [];
        f.rl = [];
        if (i > 0) {
          const prev = show.frames[i - 1].st;
          for (let j = 0; j < SEAT_COUNT; j++) {
            if (prev[j] !== f.st[j]) {
              if (f.st[j] === '0') f.ns.push(j); else f.rl.push(j);
            }
          }
          totalFlips += f.ns.length + f.rl.length;
        }
      });
    });

    // ---------- 顶栏与统计 ----------
    const bjFmt = new Intl.DateTimeFormat('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
    document.querySelector('#metaWindow').textContent = DATA.windowText;
    document.querySelector('#lede').textContent =

      ' 次全场座位变化快照。播放或拖动进度，查看场次开放与每个座位的状态变化。';
    document.querySelector('#statShows').textContent = DATA.shows.length;
    document.querySelector('#statFrames').textContent = DATA.frameCount;
    document.querySelector('#statFlips').textContent = totalFlips;
    document.querySelector('#statAvail').textContent = DATA.shows.reduce((sum, s) => sum + s.frames[s.frames.length - 1].avail, 0);

    // ---------- 构建总览卡片 ----------
    const overview = document.querySelector('#overview');
    function showTitle(show) {
      const [, m, d] = show.d.split('-');
      return Number(m) + '月' + Number(d) + '日 ' + show.tm;
    }
    DATA.shows.forEach((show) => {

      card.setAttribute('tabindex', '0');
      card.setAttribute('aria-pressed', 'false');

        '<div class="vbg-custom-card-head"><h3 class="vbg-heading-16">' + showTitle(show) + '</h3>' +

        '<span>可选 <strong class="js-avail">–</strong></span></div>';
      const minimap = card.querySelector('.vbg-custom-minimap');
      show.cells = [];
      PATTERNS.forEach((pattern, r) => {
        const row = document.createElement('div');
        row.className = 'vbg-custom-minirow';
        let k = 0;
        for (const ch of pattern) {
          const cell = document.createElement('i');
          if (ch === '.') {
            cell.className = 'vbg-custom-minicell empty';
          } else {
            const idx = INDEX_OF.get((r + 1) + ',' + SEAT_COLS[r][k++]);
            cell.className = 'vbg-custom-minicell';
            show.cells[idx] = cell;
          }
          row.appendChild(cell);
        }
        minimap.appendChild(row);
      });

        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectShow(show); }

      show.card = card;
      show.elSold = card.querySelector('.js-sold');
      show.elAvail = card.querySelector('.js-avail');
      show.elPct = card.querySelector('.vbg-custom-card-pct');
      overview.appendChild(card);
    });

    // ---------- 构建细节座位图 ----------
    const rowLabels = document.querySelector('#rowLabels');
    const detailGrid = document.querySelector('#detailGrid');
    const detailCells = [];
    PATTERNS.forEach((pattern, r) => {
      rowLabels.insertAdjacentHTML('beforeend', '<span>' + (r + 1) + '</span>');
      const row = document.createElement('div');
      row.className = 'vbg-custom-seat-row';
      let k = 0;
      for (const ch of pattern) {
        const seat = document.createElement('div');
        if (ch === '.') {
          seat.className = 'vbg-custom-seat empty';
          seat.setAttribute('aria-hidden', 'true');
        } else {
          const idx = INDEX_OF.get((r + 1) + ',' + SEAT_COLS[r][k++]);
          seat.className = 'vbg-custom-seat';
          detailCells[idx] = seat;
        }
        row.appendChild(seat);
      }
      detailGrid.appendChild(row);
    });

    // ---------- 帧渲染 ----------
    function paintCells(cells, from, to) {
      for (let i = 0; i < SEAT_COUNT; i++) {
        const cell = cells[i];
        if (!cell) continue;
        if (from === null || from[i] !== to[i]) {
          cell.classList.toggle('sold', to[i] === '0');
          cell.classList.toggle('pending', to[i] === '?');
        }
      }
    }
    function clearHl(show) {
      show.hl.forEach((el) => el.classList.remove('newsale', 'released'));
      show.hl = [];
    }
    function applyShow(show, ptr) {
      if (ptr === show.ptr) return;
      if (ptr < 0) {
        const pending = '?'.repeat(SEAT_COUNT);
        paintCells(show.cells, show.rendered, pending);
        clearHl(show);
        if (show.selected) paintCells(detailCells, show.rendered, pending);
        show.rendered = pending;
        show.ptr = ptr;
        show.elSold.textContent = '–';
        show.elAvail.textContent = '–';
        show.elPct.textContent = '待开放';
        if (show.selected) {
          detailStats.innerHTML = '<span>场次尚未开放</span>';
          changesEl.textContent = '等待该场次首次出现在公开选座页。';
        }
        return;
      }
      const f = show.frames[ptr];
      const prevSt = show.rendered;
      paintCells(show.cells, prevSt, f.st);
      clearHl(show);
      f.ns.forEach((i) => { show.cells[i].classList.add('newsale'); show.hl.push(show.cells[i]); });
      f.rl.forEach((i) => { show.cells[i].classList.add('released'); show.hl.push(show.cells[i]); });
      if (show.selected) {
        paintCells(detailCells, prevSt, f.st);
        detailCells.forEach((c) => c.classList.remove('newsale', 'released'));
        f.ns.forEach((i) => detailCells[i].classList.add('newsale'));
        f.rl.forEach((i) => detailCells[i].classList.add('released'));
      }
      show.rendered = f.st;
      show.ptr = ptr;
      show.elSold.textContent = SEAT_COUNT - f.avail;
      show.elAvail.textContent = f.avail;
      show.elPct.textContent = '已售 ' + Math.round((SEAT_COUNT - f.avail) / SEAT_COUNT * 1000) / 10 + '%';
      if (show.selected) syncDetailStats(show, f);
    }

    // ---------- 细节面板 ----------
    const detailSub = document.querySelector('#detailSub');
    const detailStats = document.querySelector('#detailStats');
    const changesEl = document.querySelector('#changes');
    function syncDetail(show) {
      detailSub.textContent = showTitle(show) + ' 场 · 场次编号 ' + show.seq;
    }
    function seatList(list) {
      if (list.length <= 12) return list.map((i) => SEAT_LABEL[i]).join('、');
      return list.slice(0, 12).map((i) => SEAT_LABEL[i]).join('、') + ' 等 ' + list.length + ' 座';
    }
    function syncDetailStats(show, f) {
      detailStats.innerHTML =
        '<span>已售 <strong>' + (SEAT_COUNT - f.avail) + '</strong>/' + SEAT_COUNT + '</span>' +
        '<span>可选 <strong>' + f.avail + '</strong></span>' +
        '<span>本帧新售 <strong>' + f.ns.length + '</strong></span>' +
        '<span>本帧释放 <strong>' + f.rl.length + '</strong></span>';
      if (show.ptr === 0) {
        changesEl.textContent = '首帧为采集开始时的基线状态，变化从第二帧开始计算。';
      } else if (f.ns.length === 0 && f.rl.length === 0) {
        changesEl.textContent = '本帧无变化。';
      } else {
        const parts = [];
        if (f.ns.length) parts.push('<strong class="is-newsale">新售 ' + f.ns.length + '</strong>：' + seatList(f.ns));
        if (f.rl.length) parts.push('<strong class="is-released">释放 ' + f.rl.length + '</strong>：' + seatList(f.rl));
        changesEl.innerHTML = parts.join('　·　');
      }
    }
    function selectShow(show) {
      DATA.shows.forEach((s) => {
        s.selected = s === show;
        s.card.setAttribute('aria-pressed', s.selected ? 'true' : 'false');
      });
      // 重绘细节图：清掉旧场次的高亮与状态
      detailCells.forEach((cell, i) => {
        if (!cell) return;
        cell.classList.remove('newsale', 'released');
        if (show.rendered !== null) {
          cell.classList.toggle('sold', show.rendered[i] === '0');
          cell.classList.toggle('pending', show.rendered[i] === '?');
        }
      });
      const f = show.frames[show.ptr];
      if (f) {
        f.ns.forEach((i) => detailCells[i].classList.add('newsale'));
        f.rl.forEach((i) => detailCells[i].classList.add('released'));
      }
      syncDetail(show);
      if (f) {
        syncDetailStats(show, f);
      } else {
        detailStats.innerHTML = '<span>场次尚未开放</span>';
        changesEl.textContent = '等待该场次首次出现在公开选座页。';
      }
    }

    // ---------- 回放引擎 ----------
    const scrub = document.querySelector('#scrub');
    const clockEl = document.querySelector('#clock');
    const offsetEl = document.querySelector('#offset');
    const playBtn = document.querySelector('#play');
    scrub.max = DURATION;
    let t = DATA.initialTime || 0;
    let playing = false;
    let speed = 30;
    let lastNow = 0;

    function ptrAt(show, time) {
      const frames = show.frames;
      let lo = 0, hi = frames.length - 1, ans = -1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        if (frames[mid].t <= time) { ans = mid; lo = mid + 1; } else hi = mid - 1;
      }
      return ans;
    }
    function fmtOffset(sec) {
      const sign = sec < 0 ? '-' : '+';
      const a = Math.abs(Math.round(sec));
      const mm = String(Math.floor(a / 60)).padStart(2, '0');
      const ss = String(a % 60).padStart(2, '0');
      return '开票 ' + sign + mm + ':' + ss;
    }
    function render() {
      scrub.value = t;
      const nowMs = DATA.startMs + t * 1000;
      clockEl.textContent = bjFmt.format(new Date(nowMs));
      offsetEl.textContent = fmtOffset((nowMs - DATA.anchorMs) / 1000);
      tlHead.setAttribute('x1', t / DURATION * 1000);
      tlHead.setAttribute('x2', t / DURATION * 1000);
      DATA.shows.forEach((show) => applyShow(show, ptrAt(show, t)));
    }
    function tick(now) {
      if (!playing) return;
      t = Math.min(DURATION, t + (now - lastNow) / 1000 * speed);
      lastNow = now;
      render();
      if (t >= DURATION) setPlaying(false);
      else requestAnimationFrame(tick);
    }
    function setPlaying(next) {
      playing = next;
      playBtn.textContent = playing ? '暂停' : '播放';
      if (playing) {
        if (t >= DURATION) t = 0;
        lastNow = performance.now();
        requestAnimationFrame(tick);
      }
    }
    playBtn.addEventListener('click', () => setPlaying(!playing));
    scrub.addEventListener('input', () => { t = Number(scrub.value); render(); });
    document.querySelectorAll('.vbg-custom-speed button').forEach((btn) => {
      btn.addEventListener('click', () => {
        speed = Number(btn.dataset.speed);
        document.querySelectorAll('.vbg-custom-speed button').forEach((b) =>
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
      });
    });

    // ---------- 时间轴曲线：合计可选座位，与进度条同轴 ----------
    const tlHead = document.querySelector('#tlHead');
    (function buildTimelineChart() {
      const SAMPLES = 464;
      const W = 1000, H = 44, PAD = 3;
      const series = [];
      let maxV = 1;
      for (let i = 0; i <= SAMPLES; i++) {
        const tt = DURATION * i / SAMPLES;
        let sum = 0;
        DATA.shows.forEach((s) => {
          const ptr = ptrAt(s, tt);
          if (ptr >= 0) sum += s.frames[ptr].avail;
        });
        series.push(sum);
        if (sum > maxV) maxV = sum;
      }
      const x = (i) => i / SAMPLES * W;
      const y = (v) => H - PAD - v / maxV * (H - PAD * 2);
      let d = 'M ' + x(0) + ' ' + y(series[0]);
      for (let i = 1; i <= SAMPLES; i++) {
        d += ' L ' + x(i) + ' ' + y(series[i - 1]) + ' L ' + x(i) + ' ' + y(series[i]);
      }
      document.querySelector('#tlLine').setAttribute('d', d);
      document.querySelector('#tlArea').setAttribute('d', d + ' L ' + W + ' ' + H + ' L 0 ' + H + ' Z');
      const tl = document.querySelector('#tlchart');
      function seekFromEvent(e) {
        const r = tl.getBoundingClientRect();
        const frac = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
        t = frac * DURATION;
        render();
      }
      tl.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        tl.setPointerCapture(e.pointerId);
        seekFromEvent(e);
        const mv = (ev) => seekFromEvent(ev);
        tl.addEventListener('pointermove', mv);
        tl.addEventListener('pointerup', () => tl.removeEventListener('pointermove', mv), { once: true });
      });
    })();

    // ---------- 初始状态 ----------
    selectShow(DATA.shows[0]);
    render();
  </script>
</body>
</html>
